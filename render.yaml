services:
  - type: web
    name: clinic-manage
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: bash run.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: clinic-manage.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://clinic-manage.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-manage-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://clinic-manage.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "1"
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: clinic-manage-db
    plan: free
